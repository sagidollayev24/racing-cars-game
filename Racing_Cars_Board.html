}

$('#import').onchange=async e=>{try{const q=JSON.parse(await e.target.files[0].text());validate(['Racer'],q);cfg.quiz=q;index=0;save();settings();notify('Question bank imported.')}catch(err){notify(err.message)}};
$('#audio').innerHTML=sounds.map((n,i)=>'<div class="audioBox"><strong>'+n+'</strong><p class="muted">'+esc(files[i]?.name||'Choose a track')+'</p><label class="upload">Upload audio<input hidden type="file" accept="audio/*" data-track="'+i+'"></label>'+(files[i]?'<audio controls src="'+urls[i]+'"></audio>':'')+'</div>').join('');
document.querySelectorAll('[data-track]').forEach(el=>el.onchange=async()=>{const i=+el.dataset.track,f=el.files[0];if(!f)return;let probe=new Audio(),u=URL.createObjectURL(f);probe.onloadedmetadata=()=>{URL.revokeObjectURL(u);attach(i,f);if(db){let t=db.transaction('tracks','readwrite');t.objectStore('tracks').put(f,i);t.onerror=()=>notify('Available for this session only. Storage is full.')}settings()};probe.onerror=()=>{URL.revokeObjectURL(u);notify('Choose an audio file your browser can play.')};probe.src=u});editor()}
function editor(){const q=cfg.quiz[index];$('#editor').innerHTML='<div class="row"><select id="qsel">'+cfg.quiz.map((_,i)=>'<option '+(i===index?'selected':'')+'>Question '+(i+1)+'</option>').join('')+'</select><button id="newq">+ Question</button><button id="delq">Delete</button></div><p></p><label>Question<input type="text" id="qt" maxlength="500" value="'+esc(q.question)+'"></label><div class="grid">'+q.options.map((s,i)=>'<label>'+String.fromCharCode(65+i)+'<input type="text" maxlength="250" data-opt="'+i+'" value="'+esc(s)+'"></label>').join('')+'</div><p></p><label>Correct answer <select id="correct">'+q.options.map((_,i)=>'<option '+(i===q.correct?'selected':'')+'>'+String.fromCharCode(65+i)+'</option>').join('')+'</select></label>';$('#qsel').onchange=e=>{index=e.target.selectedIndex;editor()};$('#qt').oninput=e=>{q.question=e.target.value;save()};document.querySelectorAll('[data-opt]').forEach(el=>el.oninput=()=>{q.options[+el.dataset.opt]=el.value;save()});$('#correct').onchange=e=>{q.correct=e.target.selectedIndex;save()};$('#newq').disabled=cfg.quiz.length===100;$('#newq').onclick=()=>{index=cfg.quiz.push({question:'New question',options:['Answer A','Answer B','Answer C','Answer D'],correct:0})-1;save();settings()};$('#delq').disabled=cfg.quiz.length===1;$('#delq').onclick=()=>{cfg.quiz.splice(index,1);index=Math.min(index,cfg.quiz.length-1);save();settings()}}


let players=[],round=0,end=0,timer;
function start(){
 try{validate(cfg.names,cfg.quiz)}catch(e){notify(e.message);return}
 players=cfg.names.map((name,i)=>({name,i,steps:0,marked:false}));round=0;play(0);question();
}
function question(){
 clearInterval(timer);players.forEach(p=>p.marked=false);end=Date.now()+20000;
 const q=cfg.quiz[round];
 app.innerHTML='<section class="panel"><div class="row space"><h3>Question '+(round+1)+' / '+cfg.quiz.length+'</h3><b id="clock"></b></div><h2>'+esc(q.question)+'</h2><div class="answers">'+q.options.map((o,i)=>'<div class="answer">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>').join('')+'</div><p></p><button id="reveal">Reveal answer</button><p id="answer"></p><h3>Race standings</h3><p>After revealing the answer, tap each racer who answered correctly.</p><div id="lanes"></div><p></p><button class="primary" disabled id="next">'+(round+1===cfg.quiz.length?'Awards ceremony':'Next question')+'</button></section>';
 const reveal=()=>{clearInterval(timer);$('#clock').textContent='Answers closed';$('#reveal').disabled=true;$('#next').disabled=false;$('#answer').textContent='Correct answer: '+q.options[q.correct];document.querySelectorAll('[data-i]').forEach(b=>b.disabled=false)};
 $('#lanes').innerHTML=players.map((p,i)=>'<div class="lane"><button disabled data-i="'+i+'">'+esc(p.name)+'</button><div class="road"><div style="position:absolute;inset:0 90px 0 0"><div id="car'+i+'" style="position:absolute;height:100%;width:80px;transition:left .6s;left:'+100*p.steps/cfg.quiz.length+'%">'+car(i)+'</div></div></div></div>').join('');
 document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i,p=players[i];p.marked=!p.marked;p.steps+=p.marked?1:-1;b.textContent=(p.marked?'✓ ':'')+p.name;$('#car'+i).style.left=100*p.steps/cfg.quiz.length+'%';if(p.marked)play(1)});
 const tick=()=>{let seconds=Math.ceil((end-Date.now())/1000);$('#clock').textContent=seconds+' s';if(seconds<=0)reveal()};tick();timer=setInterval(tick,200);$('#reveal').onclick=reveal;
 $('#next').onclick=()=>{if(++round<cfg.quiz.length)question();else finish()};
}
function finish(){
 clearInterval(timer);stop(0);stop(1);play(2);const ranks=[...players].sort((a,b)=>b.steps-a.steps||a.i-b.i);
 const rank=p=>1+ranks.findIndex(r=>r.steps===p.steps);
 app.innerHTML='<div class="panel"><h2>🏆 Final results</h2><p>'+cfg.quiz.length+' questions completed</p><div class="pod">'+[1,0,2].filter(i=>ranks[i]).map(i=>{const p=ranks[i];return '<div class="step">'+car(p.i)+'<div class="block" style="min-height:'+(140-i*25)+'px"><strong>'+esc(p.name)+'</strong><br>'+p.steps*100+' pts<b>'+rank(p)+'</b></div></div>'}).join('')+'</div>'+ranks.slice(3).map(p=>'<div class="rankline">'+rank(p)+'. '+esc(p.name)+'</div>').join('')+'<p></p><button id="again">New race</button></div>';$('#again').onclick=()=>{stop(2);home()};
}
home();</script></html>
